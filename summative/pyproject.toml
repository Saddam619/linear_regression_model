[project]
name = "linear-regression-model"
version = "0.1.0"
description = "Africa-wide Unemployment Prediction - Linear Regression Summative"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]
